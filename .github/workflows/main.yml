name: Build Windows Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "推送到 tag 或手动触发时创建 GitHub Release"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZCODE_ENV: production
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/

jobs:
  win-desktop:
    name: Windows Desktop x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm 10.33.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - name: Verify toolchain
        run: |
          node -v
          npm -v
          pnpm -v

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bootstrap + Bundle (production backend)
        env:
          ZCODE_ENV: production
        run: |
          pnpm bootstrap
          pnpm bundle:desktop -- --os win --arch x64

      - name: Show outputs
        shell: bash
        run: ls -lh packages/desktop/dist/ | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-desktop-win-x64
          path: |
            packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: win-desktop
    if: |
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/v')
        || inputs.create_release == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.win-desktop.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('ZCode {0} (Windows)', needs.win-desktop.outputs.version) }}
          body: |
            ## ZCode v${{ needs.win-desktop.outputs.version }} — Windows x64

            **本次 CI 使用生产后端（`ZCODE_ENV=production`）构建。**

            ### SmartScreen 告警说明
            右键 exe → 属性 → 勾选"解除锁定"（如果存在），或在 SmartScreen 弹窗点 **"更多信息 → 仍要运行"**。

            > 没有 EV 代码签名证书（需要购买），SmartScreen 会提示一次警告。
          generate_release_notes: true
          files: |
            artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
